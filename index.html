<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1a1a2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PixelArt"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Editor Pixel Art</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;display:grid;grid-template-columns:1fr 420px;height:100vh;gap:20px;padding:20px}canvas{border:2px solid #64b5f6;background:#0a0e27;image-rendering:pixelated;cursor:crosshair}.sidebar{background:#16213e;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:15px;overflow-y:auto}h1{font-size:24px;margin-bottom:20px}.section{display:flex;flex-direction:column;gap:10px}.section h2{font-size:13px;color:#64b5f6;border-bottom:1px solid #2a3a5a;padding-bottom:8px;text-transform:uppercase}button{background:#0f3460;border:1px solid #64b5f6;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;width:100%}button:hover{background:#1a4d7a}button.active{background:#64b5f6;color:#1a1a2e}.brush-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.brush-grid button{width:100%}.color-preview{width:100%;height:40px;border-radius:6px;border:2px solid #64b5f6}input[type="range"]{width:100%;height:6px;background:#2a3a5a;border-radius:3px}textarea{width:100%;height:60px;background:#0a0e27;border:1px solid #64b5f6;border-radius:6px;color:#fff;font-family:monospace;font-size:10px;padding:8px;resize:none}label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}select{background:#0f3460;border:1px solid #64b5f6;color:#fff;padding:8px;border-radius:6px;font-size:12px;width:100%}#swatches{display:flex;flex-wrap:wrap;gap:2px}.sw{height:24px;cursor:pointer;border:1px solid #0a0e27;border-radius:2px}.sw:hover{outline:2px solid #fff;z-index:1}.sw.sel{outline:2px solid #64b5f6}input[type=number]{background:#0f3460;border:1px solid #64b5f6;color:#fff;padding:6px;border-radius:6px}.mini{width:auto;padding:6px 10px}.layer-row{display:flex;gap:6px;align-items:center}.layer-row button{text-align:left}.fr-b{width:34px;padding:6px 0}canvas{touch-action:none;max-width:100%;height:auto}button{touch-action:manipulation}@media (max-width:820px){body{grid-template-columns:1fr;height:auto;min-height:100vh;padding:10px;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}h1{font-size:18px;margin-bottom:6px}.sidebar{overflow:visible;padding:14px}}</style></head><body><div style="display:flex;flex-direction:column;align-items:center;gap:14px;overflow-y:auto"><h1 id="ttl">🎨 Pixel Art Editor 64x64</h1><canvas id="canvas"></canvas><div id="anim" style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px"><button id="aPrev" class="mini" title="Frame anterior">⏮</button><button id="aPlay" class="mini" title="Play">▶</button><button id="aPause" class="mini" title="Pausa">⏸</button><button id="aStop" class="mini" title="Stop (vuelve al frame 1)">⏹</button><button id="aNext" class="mini" title="Frame siguiente">⏭</button><span>FPS</span><input type="range" id="aFps" min="1" max="24" value="8" style="width:90px"><span id="aFpsVal">8</span><span>Frames</span><input type="number" id="aCount" min="1" max="64" value="1" style="width:60px"><button id="aCountApply" class="mini">OK</button><button id="aDup" class="mini" title="Duplica el frame actual a continuación">⧉ Duplicar frame</button><label style="justify-content:flex-start;gap:4px;margin:0;cursor:pointer"><input type="checkbox" id="aOnion">Onion skin</label></div><div id="frameStrip" style="display:flex;gap:4px;flex-wrap:wrap"></div></div><div id="layersPanel" style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:6px;align-items:center"><strong style="color:#64b5f6;font-size:13px">CAPAS</strong><button id="lAdd" class="mini">+ Capa</button><button id="lDel" class="mini" title="Borrar capa">🗑</button><button id="lUp" class="mini" title="Subir capa">↑</button><button id="lDown" class="mini" title="Bajar capa">↓</button></div><div id="layerList" style="display:flex;flex-direction:column;gap:4px"></div></div></div><div class="sidebar"><div class="section"><h2>Tamaño del lienzo</h2><select id="szSel"></select><div id="customSz" style="display:none;align-items:center;gap:6px"><input id="cw" type="number" min="1" max="256" value="64" style="width:70px"><span>px ×</span><input id="ch" type="number" min="1" max="256" value="64" style="width:70px"><span>px</span><button id="customApply" style="width:auto">Aplicar</button></div><div id="szInfo" style="font-size:11px;color:#aaa">Zona de dibujo del llavero (centrada en la OLED 128x64)</div></div><div class="section"><h2>Herramientas</h2><button class="tool-btn active" data-tool="pen">✏️ Pincel</button><button class="tool-btn" data-tool="bucket">🪣 Balde</button><button class="tool-btn" data-tool="eyedropper">🎯 Pipeta</button><div id="bucketOpts" style="display:none;grid-template-columns:repeat(3,1fr);gap:8px"><button class="bm-btn active" data-bmode="all" title="Llenar todo el lienzo">▦ Todo</button><button class="bm-btn" data-bmode="color" title="Reemplazar ese color en todo el lienzo">◐ Color</button><button class="bm-btn" data-bmode="contig" title="Solo píxeles en contacto">⛓ Contacto</button></div></div><div class="section"><h2>Forma</h2><div class="brush-grid"><button class="brush-btn active" data-brush="square">⬜ Cuadrado</button><button class="brush-btn" data-brush="cross">➕ Cruz</button><button class="brush-btn" data-brush="circle">⭕ Círculo</button><button class="brush-btn" data-brush="diamond">◆ Diamante</button><button class="brush-btn" data-brush="rhombus">⬧ Rombo</button><button class="brush-btn" data-brush="xshape">✖ Aspa</button><button class="brush-btn" data-brush="triangle">▲ Triángulo</button><button class="brush-btn" data-brush="hline">▬ Línea</button><button class="brush-btn" data-brush="asterisk">✳ Asterisco</button><button class="brush-btn" data-brush="ring">◯ Anillo</button><button class="brush-btn" data-brush="heart">♥ Corazón</button></div><button id="rotBtn">↻ Girar forma: 0°</button><div id="rotDial" style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px"></div></div><div class="section"><h2>Tamaño</h2><label>Radio: <span id="brushVal">1</span></label><input type="range" id="brushSlider" min="1" max="5" value="1"></div><div class="section"><h2>Color</h2><div class="color-preview" id="colorPreview"></div><label>Hue: <span id="hueVal">0°</span><input type="range" id="hueSlider" min="0" max="360" value="0" style="width:70%;margin:0"></label><label>Saturación: <span id="satVal">100%</span><input type="range" id="satSlider" min="0" max="100" value="100" style="width:70%;margin:0"></label><label>Luminancia: <span id="lumVal">50%</span><input type="range" id="lumSlider" min="0" max="100" value="50" style="width:70%;margin:0"></label><label>Opacidad: <span id="alphaVal">100%</span><input type="range" id="alphaSlider" min="0" max="100" value="100" style="width:70%;margin:0"></label><input type="checkbox" id="blackAlpha" style="display:none"><button id="blackAlphaBtn" title="Los píxeles negros puros se tratan como transparentes: en la vista, en el PNG y en los efectos">⬛ Negro = transparente</button></div><div class="section"><h2>Paletas</h2><select id="paletteSel"></select><div id="swatches"></div><div id="palInfo" style="font-size:11px;color:#aaa"></div></div><div class="section"><h2>Efectos</h2><label>Radio del glow: <span id="fxVal">2</span></label><input type="range" id="fxSlider" min="1" max="5" value="2"><label>Color del reborde: <input type="color" id="obColor" value="#ffffff" style="width:60px;height:28px;padding:0;border:none;background:none"></label><label>Grosor del reborde: <span id="obVal">0</span></label><input type="range" id="obSlider" min="0" max="6" value="0"><button onclick="applyGlow()">✨ Glow (color y opacidad actuales)</button><button onclick="undoFx()">↩ Deshacer efecto</button></div><div class="section"><h2>Exportar</h2><textarea id="exportData" readonly></textarea><button onclick="copyToClipboard()">📋 Copiar</button><button onclick="downloadJSON()">💾 JSON</button><button onclick="downloadBinary()">💾 BIN</button><button onclick="downloadAnimJSON()">🎞 JSON animación</button><button onclick="downloadSheet()">🎞 PNG sprite sheet</button></div><div class="section"><button onclick="clearCanvas()">🗑️ Limpiar</button><button onclick="downloadImage()">📷 PNG</button></div></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let W=64,H=64;let PSIZE=8;canvas.width=512;canvas.height=512;const EMPTY={c:'#808080',a:1,e:1};let grid=Array(H).fill(null).map(()=>Array(W).fill(EMPTY));let bucketMode='all';let lastPt=null;let tool='pen',brush='square',color='#ffff00',alpha=1,bsize=1,drawing=false;const updateColor=()=>{const h=document.getElementById('hueSlider').value;const s=document.getElementById('satSlider').value;const l=document.getElementById('lumSlider').value;color=`hsl(${h},${s}%,${l}%)`;alpha=parseInt(document.getElementById('alphaSlider').value)/100;document.getElementById('colorPreview').style.background=color;document.getElementById('colorPreview').style.opacity=alpha;document.getElementById('hueVal').textContent=h+'°';document.getElementById('satVal').textContent=s+'%';document.getElementById('lumVal').textContent=l+'%';document.getElementById('alphaVal').textContent=Math.round(alpha*100)+'%';updateExport()};document.querySelectorAll('.tool-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');tool=btn.dataset.tool}));document.querySelectorAll('.brush-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.brush-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');brush=btn.dataset.brush}));['hueSlider','satSlider','lumSlider','alphaSlider'].forEach(id=>document.getElementById(id).addEventListener('input',updateColor));document.getElementById('brushSlider').addEventListener('input',(e)=>{bsize=e.target.value;document.getElementById('brushVal').textContent=bsize});const getCoords=(e)=>{const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;return[Math.floor((e.clientX-rect.left)*sx/PSIZE),Math.floor((e.clientY-rect.top)*sy/PSIZE)]};const setPixel=(x,y,c,a)=>{if(x>=0&&x<W&&y>=0&&y<H)grid[y][x]={c,a}};const brushCells=(x,y)=>{const s=parseInt(bsize);const out=[];const add=(px,py)=>out.push([px,py]);const mk=maskOf(brush,s);if(mk){mk.forEach(([dx,dy])=>add(x+dx,y+dy))}else if(brush==='square'){for(let dx=-Math.floor(s/2);dx<Math.ceil(s/2);dx++)for(let dy=-Math.floor(s/2);dy<Math.ceil(s/2);dy++)add(x+dx,y+dy)}else if(brush==='cross'){add(x,y);for(let i=1;i<=s;i++){add(x+i,y);add(x-i,y);add(x,y+i);add(x,y-i)}}else if(brush==='circle'){for(let dx=-s;dx<=s;dx++)for(let dy=-s;dy<=s;dy++)if(Math.sqrt(dx*dx+dy*dy)<=s)add(x+dx,y+dy)}return out};const drawBrush=(x,y,c,a)=>{brushCells(x,y).forEach(([px,py])=>setPixel(px,py,c,a))};const draw=(x,y,c,a)=>{drawBrush(x,y,c,a);redraw()};const redraw=()=>{ctx.globalAlpha=1;ctx.fillStyle='#808080';ctx.fillRect(0,0,canvas.width,canvas.height);if(document.getElementById('aOnion').checked&&frames.length>1){const P=flat((cf-1+frames.length)%frames.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const q=P[y][x];if(q.e||q.a<=0)continue;ctx.globalAlpha=0.3*q.a;ctx.fillStyle=q.c;ctx.fillRect(x*PSIZE,y*PSIZE,PSIZE,PSIZE)}ctx.globalAlpha=1}const keyB=document.getElementById('blackAlpha').checked;const G=fin();for(let y=0;y<H;y++){for(let x=0;x<W;x++){const px=G[y][x];if(px.e)continue;if(keyB){const r=px.c.startsWith('hsl')?hslToRgb(px.c):{r:parseInt(px.c.slice(1,3),16),g:parseInt(px.c.slice(3,5),16),b:parseInt(px.c.slice(5,7),16)};if(r.r===0&&r.g===0&&r.b===0)continue}ctx.globalAlpha=px.a;ctx.fillStyle=px.c;ctx.fillRect(x*PSIZE,y*PSIZE,PSIZE,PSIZE)}}ctx.globalAlpha=1;ctx.strokeStyle='#1a2a4a';ctx.lineWidth=1;for(let i=0;i<=W;i++){ctx.beginPath();ctx.moveTo(i*PSIZE,0);ctx.lineTo(i*PSIZE,canvas.height);ctx.stroke()}for(let i=0;i<=H;i++){ctx.beginPath();ctx.moveTo(0,i*PSIZE);ctx.lineTo(canvas.width,i*PSIZE);ctx.stroke()}};const drawPreview=(x,y)=>{const a=ctx.globalAlpha;ctx.globalAlpha=0.6*alpha;ctx.fillStyle=color;brushCells(x,y).forEach(([px,py])=>{if(px>=0&&px<W&&py>=0&&py<H)ctx.fillRect(px*PSIZE,py*PSIZE,PSIZE,PSIZE)});ctx.globalAlpha=a};canvas.addEventListener('pointerdown',(e)=>{try{canvas.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=getCoords(e);if(x<0||x>=W||y<0||y>=H)return;if(tool==='eyedropper'){pickPixel(x,y);return}if(tool==='bucket'){bucketFill(x,y);return}drawing=true;lastPt=[x,y];draw(x,y,color,alpha)});canvas.addEventListener('pointermove',(e)=>{const[x,y]=getCoords(e);redraw();drawPreview(x,y);if(drawing&&tool==='pen'&&e.buttons===1){const[lx,ly]=lastPt||[x,y];const dx=Math.abs(x-lx),dy=Math.abs(y-ly),sx=lx<x?1:-1,sy=ly<y?1:-1;let err=dx-dy,cx=lx,cy=ly;while(true){drawBrush(cx,cy,color,alpha);if(cx===x&&cy===y)break;const e2=2*err;if(e2>-dy){err-=dy;cx+=sx}if(e2<dx){err+=dx;cy+=sy}}lastPt=[x,y];redraw()}});canvas.addEventListener('pointerup',()=>{drawing=false});canvas.addEventListener('pointerleave',()=>{redraw();drawing=false});canvas.addEventListener('contextmenu',(e)=>e.preventDefault());const updateExport=()=>{const data=fexp().map(row=>row.map(px=>{const c=px.c;const rgb=c.startsWith('hsl')?hslToRgb(c):{r:parseInt(c.slice(1,3),16),g:parseInt(c.slice(3,5),16),b:parseInt(c.slice(5,7),16)};const gray=Math.round(0.299*rgb.r+0.587*rgb.g+0.114*rgb.b);return Math.round(gray*px.a)}));document.getElementById('exportData').value=JSON.stringify(data)};const hslToRgb=(c)=>{const m=c.match(/\d+/g);const h=parseInt(m[0]),s=parseInt(m[1])/100,l=parseInt(m[2])/100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return{r:Math.round(255*f(0)),g:Math.round(255*f(8)),b:Math.round(255*f(4))}};const clearCanvas=()=>{grid=Array(H).fill(null).map(()=>Array(W).fill(EMPTY));frames[cf][cl]=grid;redraw();updateExport()};const copyToClipboard=()=>{updateExport();document.getElementById('exportData').select();document.execCommand('copy');alert('¡Copiado!')};const downloadJSON=()=>{const data=fexp().map(row=>row.map(px=>{const rgb=px.c.startsWith('hsl')?hslToRgb(px.c):{r:parseInt(px.c.slice(1,3),16),g:parseInt(px.c.slice(3,5),16),b:parseInt(px.c.slice(5,7),16)};const gray=Math.round(0.299*rgb.r+0.587*rgb.g+0.114*rgb.b);return Math.round(gray*px.a)}));dl(new Blob([JSON.stringify(data)],{type:'application/json'}),'pixel_art.json')};const downloadBinary=()=>{const data=fexp().map(row=>row.map(px=>{const rgb=px.c.startsWith('hsl')?hslToRgb(px.c):{r:parseInt(px.c.slice(1,3),16),g:parseInt(px.c.slice(3,5),16),b:parseInt(px.c.slice(5,7),16)};const gray=Math.round(0.299*rgb.r+0.587*rgb.g+0.114*rgb.b);return Math.round(gray*px.a)}));const bytes=new Uint8Array(W*H);data.forEach((row,y)=>row.forEach((val,x)=>{bytes[y*W+x]=val}));dl(new Blob([bytes],{type:'application/octet-stream'}),'pixel_art.bin')};const downloadImage=()=>{const keyBlack=document.getElementById('blackAlpha').checked;const oc=document.createElement('canvas');oc.width=W;oc.height=H;const octx=oc.getContext('2d');const id=octx.createImageData(W,H);const G=fexp();for(let y=0;y<H;y++){for(let x=0;x<W;x++){const px=G[y][x];const rgb=px.c.startsWith('hsl')?hslToRgb(px.c):{r:parseInt(px.c.slice(1,3),16),g:parseInt(px.c.slice(3,5),16),b:parseInt(px.c.slice(5,7),16)};const isBlack=rgb.r===0&&rgb.g===0&&rgb.b===0;const i=(y*W+x)
